<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registration Successful</title>

    <link
        rel="stylesheet"
        href="/registration-success.css"
    >
</head>

<body>

<div class="page">

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>
            Registration successful
        </h1>

        <p>
            Your account has been successfully
            created and MFA has been enabled.
        </p>

        <div class="success-status">

            <div>
                <span>Account</span>
                <strong>Created ✓</strong>
            </div>

            <div>
                <span>Email</span>
                <strong>Verified ✓</strong>
            </div>

            <div>
                <span>Mobile</span>
                <strong>Verified ✓</strong>
            </div>

            <div>
                <span>MFA</span>
                <strong>Enabled ✓</strong>
            </div>

        </div>

        <button
            id="loginButton"
            type="button"
        >
            Continue to Login
        </button>

    </div>

</div>

<script src="/registration-success.js"></script>

</body>

</html>
