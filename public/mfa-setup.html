<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MFA Verification</title>

    <link
        rel="stylesheet"
        href="/mfa-setup.css"
    >
</head>

<body>

<div class="page">

    <div class="mfa-card">

        <div class="security-icon">
            ✓
        </div>

        <h1>
            Multi-factor authentication
        </h1>

        <p class="description">
            Your email and mobile number have been
            successfully verified.
        </p>

        <div class="status-box">

            <div class="status-row">
                <span>Email</span>
                <strong>Verified ✓</strong>
            </div>

            <div class="status-row">
                <span>Mobile</span>
                <strong>Verified ✓</strong>
            </div>

        </div>

        <div class="mfa-message">

            <h2>
                MFA is now enabled
            </h2>

            <p>
                Your account is protected with
                multi-factor authentication.
            </p>

        </div>

        <button
            id="continueButton"
            class="continue-button"
            type="button"
        >
            Continue
        </button>

    </div>

</div>

<script src="/mfa-setup.js"></script>

</body>
</html>
